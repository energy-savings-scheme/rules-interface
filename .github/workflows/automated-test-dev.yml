name: Backup and Synch Autotest Data

on:
  workflow_dispatch:

jobs:
  start-vm:
    name: Start VM
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.SAFEGUARD_ESTIMATOR_INTEGRATIONS_AZURE_CREDS }}
          
      - name: Start VM
        run: az vm start -g ${{ secrets.AZURE_RESOURCE_GROUP_PROD }} -n ${{ secrets.AZURE_VM_CI_NAME_PROD }}

  backup-and-synch-auto-test-data:
    name: Backup and Synch Autotest Data
    needs: start-vm
    if: >-
      success() &&
      github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Backup current production data and synch
        run: |
          set -e
          mkdir -p /home/azureuser/backup && cp /home/azureuser/data.xlsx /home/azureuser/backup/data-$(date +%Y%m%d-%H%M%S).xlsx
          cp /home/azureuser/data-dev.xlsx /home/azureuser/data.xlsx

  stop-vm:
    name: Stop VM
    needs: backup-and-synch-auto-test-data
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.SAFEGUARD_ESTIMATOR_INTEGRATIONS_AZURE_CREDS }}

      - name: Stop VM
        run: az vm deallocate -g ${{ secrets.AZURE_RESOURCE_GROUP_PROD }} -n ${{ secrets.AZURE_VM_CI_NAME_PROD }}
